name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
env:
  PAD_MB: 80   # розмір балласту в МБ; APK вийде ≈ 20 + PAD_MB
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Створити Android-обвʼязку
        run: |
          flutter create . --platforms=android --project-name egidnist --org ua.egidnist
          cp src/*.dart lib/
          sed -i 's/android:label="[^"]*"/android:label="Є-Гідність"/' android/app/src/main/AndroidManifest.xml
      - name: Балласт до ~100 МБ
        run: |
          mkdir -p assets/padding
          for i in $(seq 1 $((PAD_MB/10))); do
            head -c 10485760 /dev/urandom > assets/padding/data_$i.bin
          done
          du -sh assets/padding
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: egidnist-apk
          path: build/app/outputs/flutter-apk/*.apk
